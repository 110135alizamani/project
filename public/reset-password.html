<!DOCTYPE html>
<html lang="fa" dir="rtl" itemscope itemtype="https://schema.org/WebPage">
<head>
  <link rel="stylesheet" href="../resources/assets/css/main.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تعیین رمز عبور جدید پس از تأیید هویت در سایت معرفت">
  <meta name="keywords" content="بازیابی رمز عبور, سایت معرفت, رمز جدید, تأیید هویت">
  <meta name="author" content="معرفت">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://example.com/reset-password">
  <title>بازیابی رمز عبور | معرفت</title>
</head>
<body>

  <header>
    <h1 class="site-title">
      <img src="../resources/assets/images/logo.svg" alt="لوگو معرفت" height="40"> معرفت</h1>
    <nav class="main-nav" aria-label="ناوبری اصلی سایت">
      <ul>
        <li><a href="about.html">درباره معرفت</a></li>
        <li><a href="team.html">تیم ما</a></li>
        <li><a href="contact.html">تماس با معرفت</a></li>
        <li><a href="donation.html">کمک‌های خیر</a></li>
      </ul>
    </nav>
  
    <nav class="auth-nav" aria-label="ناوبری کاربری">
      <ul>
        <li><a href="login.html" class="btn-primary">ورود</a></li>
        <li><a href="signup.html" class="btn-primary">ثبت‌نام</a></li>
        <li><a href="dashboard.html">داشبورد</a></li>
        <li><a href="logout.html">خروج</a></li>
      </ul>
    </nav>
  </header>
  
  <main itemprop="mainContentOfPage">
    <section aria-labelledby="reset-title">
      <h2 id="reset-title">تنظیم رمز عبور جدید</h2>
      <form action="/reset-password" method="post" itemprop="potentialAction" itemscope itemtype="https://schema.org/ResetPassword">
        <label for="new-password">رمز عبور جدید:</label>
        <input type="password" id="new-password" name="new-password" required itemprop="target">

        <label for="confirm-password">تکرار رمز عبور:</label>
        <input type="password" id="confirm-password" name="confirm-password" required>

        <button type="submit" class="btn-primary" itemprop="name">ذخیره رمز جدید</button>
      </form>
    </section>

    <!-- 🎯 دعوت به اقدام (CTA) -->
    <section id="cta">
      <h2>به خانواده معرفت بپیوندید</h2>
      <p>اگر حساب کاربری ندارید، همین حالا ثبت‌نام کنید یا وارد شوید.</p>
      <div style="display:flex; gap:1rem;">
        <a href="signup.html" class="btn-primary">ثبت‌نام</a>
        <a href="login.html" class="btn-primary">ورود</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span itemprop="copyrightYear">2025</span>

       تمامی حقوق محفوظ است.</p>
